# Opérations ponctuelles sur le contenu Storyblok (scripts/storyblok/ops/*.mjs) :
# GitHub → Actions → "Storyblok Content Op" → Run workflow. Toujours faire d'abord une
# simulation (dry_run) : le journal montre l'état de la page et le plan de modification.
# Nécessite les secrets du dépôt STORYBLOK_PAT et STORYBLOK_SPACE_ID.

name: Storyblok Content Op

on:
  workflow_dispatch:
    inputs:
      op:
        description: "Opération"
        type: choice
        options:
          - merge-cert-sections
          - set-story-fields
          - dump-story
        default: merge-cert-sections
      dry_run:
        description: "Simulation (n'écrit rien dans Storyblok)"
        type: boolean
        default: true
      publish:
        description: "Publier la page après modification (sinon brouillon à publier dans Storyblok)"
        type: boolean
        default: false
      story:
        description: "Slug complet de la page"
        type: string
        default: "pages/a-propos"
      title:
        description: "Titre de la section fusionnée (merge-cert-sections)"
        type: string
        default: "Nos certifications et récompenses"
      fields:
        description: "Champs à poser, objet JSON (set-story-fields), ex. {\"instagram_url\":\"https://…\"}"
        type: string
        default: ""
      block:
        description: "set-story-fields : bloc cible (_uid ou nom de composant, ex. chr_hero) ; vide = racine de la story"
        type: string
        default: ""
      copy_from:
        description: "set-story-fields : copier des champs depuis « slug » ou « slug#bloc », ex. pages/cafe-bureau-entreprise#landing_hero"
        type: string
        default: ""
      copy_fields:
        description: "set-story-fields : champs à copier (virgules), seulement s'ils sont vides sur la cible, ex. image,image_style"
        type: string
        default: ""
      rename_fields:
        description: "set-story-fields : déplacer des valeurs dans la cible, « ancien:nouveau » séparés par des virgules (l'ancien champ est vidé)"
        type: string
        default: ""

jobs:
  op:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Opération de contenu
        env:
          STORYBLOK_PAT: ${{ secrets.STORYBLOK_PAT }}
          STORYBLOK_SPACE_ID: ${{ secrets.STORYBLOK_SPACE_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          PUBLISH: ${{ inputs.publish && '1' || '' }}
          STORY_SLUG: ${{ inputs.story }}
          NEW_TITLE: ${{ inputs.title }}
          FIELDS: ${{ inputs.fields }}
          BLOCK: ${{ inputs.block }}
          COPY_FROM: ${{ inputs.copy_from }}
          COPY_FIELDS: ${{ inputs.copy_fields }}
          RENAME_FIELDS: ${{ inputs.rename_fields }}
        run: node "scripts/storyblok/ops/${{ inputs.op }}.mjs"
